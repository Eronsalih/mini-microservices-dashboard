name: Mini Microservices CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-ghcr:
    name: Build & Push GHCR - ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mini-frontend
            context: ./frontend
          - image: mini-user-service
            context: ./backend/user-service
          - image: mini-task-service
            context: ./backend/task-service
          - image: mini-message-service
            context: ./backend/message-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image owner
        id: vars
        shell: bash
        run: |
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  push-to-dockerhub:
    name: Push Docker Hub - ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr
    strategy:
      fail-fast: false
      matrix:
        image:
          - mini-frontend
          - mini-user-service
          - mini-task-service
          - mini-message-service

    steps:
      - name: Prepare image names
        id: vars
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          DH_USER=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "dockerhub_user=$DH_USER" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull from GHCR and push to Docker Hub
        shell: bash
        run: |
          set -euo pipefail

          SRC="ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}:sha-${{ steps.vars.outputs.short_sha }}"
          DEST="${{ steps.vars.outputs.dockerhub_user }}/${{ matrix.image }}"

          docker pull "$SRC"

          docker tag "$SRC" "$DEST:sha-${{ steps.vars.outputs.short_sha }}"
          docker push "$DEST:sha-${{ steps.vars.outputs.short_sha }}"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            docker tag "$SRC" "$DEST:latest"
            docker push "$DEST:latest"
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            docker tag "$SRC" "$DEST:$VERSION"
            docker push "$DEST:$VERSION"
          fi
