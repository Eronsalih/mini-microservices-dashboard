name: CI/CD - Build, Push and Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =========================================================
  # JOB 1 - BUILD AND PUSH TO DOCKER HUB
  # =========================================================
  build-and-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
            image: mini-microservices-frontend

          - service: user-service
            context: ./backend/user-service
            image: mini-microservices-user-service

          - service: task-service
            context: ./backend/task-service
            image: mini-microservices-task-service

          - service: message-service
            context: ./backend/message-service
            image: mini-microservices-message-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================
  # JOB 2 - DEPLOY TO VM
  # =========================================================
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest

    needs: build-and-push

    # deploy vetëm kur bëhet push në main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy production Docker Compose to VM
        run: |
          scp docker-compose.prod.yml \
          "${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USERNAME }}/docker-compose.yml"

      - name: Deploy containers
        run: |
          ssh "${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }}" << 'EOF'

            set -e

            cd /home/${{ secrets.VM_USERNAME }}

            echo "Logging in to Docker Hub..."

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            echo "Pulling latest Docker images..."
            docker compose pull

            echo "Starting containers..."
            docker compose up -d

            echo "Removing unused images..."
            docker image prune -f

            echo "Running containers:"
            docker compose ps

          EOF
